# ЗАДАЧА
Подготовь итоговый учебный материал на основании нескольких частей конспекта одной IT-лекции.
Входные данные могут содержать несколько файлов или фрагментов, полученных из разных частей одной лекции.
Каждая часть ранее была отдельно обработана и преобразована в подробный конспект.
Твоя задача — **объединить информацию из всех предоставленных частей в единый структурированный учебный материал**.

---

# ГЛАВНЫЙ ПРИНЦИП
Не создавай отдельный результат для каждого файла.
Все файлы являются частями **одной лекции**, поэтому воспринимай их как единый источник информации.
Объедини связанные сведения из разных частей.
Если одна и та же тема встречается в нескольких файлах, объедини информацию в один раздел вместо повторения.
При объединении **не теряй дополнительные детали**, которые присутствуют только в одном из файлов.
Главная цель:
**объединить → структурировать → устранить дублирование → сохранить содержательную полноту.**

---

# СТРУКТУРА ИТОГОВОГО МАТЕРИАЛА
Используй следующую структуру:
# Основная идея
Кратко опиши, чему посвящена лекция, какие основные задачи или проблемы рассматриваются и какую общую картину должен понять студент.
# Ключевые понятия
Систематизируй основные концепции, технологии и подходы, рассмотренные в лекции.
Объединяй связанные понятия.
Не повторяй одно понятие несколько раз.
# Важные определения
Собери существенные определения и объяснения терминов.
Формат:
**Термин** — определение или объяснение.
Не добавляй определения из собственных знаний.
# Практические примеры
Собери значимые примеры, которые приводятся в лекции.
Не придумывай собственные примеры.
Если один пример раскрывается в нескольких частях, объедини его в одно полное описание.
# Лучшие практики
Собери рекомендации и практические подходы, которые непосредственно представлены преподавателем.
Не превращай собственные рассуждения в рекомендации.
Не добавляй практики, которых нет в исходном материале.
# Типичные ошибки
Собери ошибки, проблемы, ограничения и предупреждения, упомянутые в лекции.
Не придумывай дополнительные ошибки.
# Что стоит запомнить
Сформулируй наиболее важные выводы и факты из лекции.
Этот раздел должен быть кратким и концентрировать действительно ключевую информацию.
Не добавляй новые выводы от себя.
# Чек-лист применения
Сформируй практический чек-лист **только на основании действий и рекомендаций, которые присутствуют в исходном материале**.
Используй формат:
* [ ] ...
* [ ] ...
* [ ] ...
Не добавляй в чек-лист действия, которые не были рассмотрены в лекции.

---

# ДЕДУПЛИКАЦИЯ
Это одна из главных задач.
Одна и та же информация может встречаться в нескольких частях лекции.
Если информация повторяется:
* не дублируй её;
* объедини её;
* сохрани наиболее полное объяснение;
* добавь уникальные детали из других частей.
Например, если в одном файле объясняется, что такое RAG, а в другом дополнительно описываются его компоненты, итоговый раздел должен содержать **единое полное описание RAG**, а не два отдельных описания.
Если повторяется только формулировка, но во втором месте появляется новая информация — сохрани новую информацию.

---

# СОХРАНЕНИЕ ИНФОРМАЦИИ
При объединении не стремись сделать итоговый материал максимально коротким.
**Приоритет — полнота и полезность.**
Не удаляй информацию только потому, что она кажется второстепенной.
Особенно сохраняй:
* технические детали;
* причинно-следственные связи;
* определения;
* характеристики технологий;
* ограничения;
* практические рекомендации;
* примеры;
* алгоритмы;
* последовательности действий;
* сравнения;
* преимущества и недостатки;
* важные числа и параметры.
При этом удаляй повторение одной и той же информации.

---

# УРОВЕНЬ СЖАТИЯ
Итоговый материал должен быть **заметно короче суммы исходных конспектов**, но не должен превращаться в короткое резюме.
Не теряй существенные объяснения.
Если несколько частей подробно раскрывают одну тему, объедини их в одно более полное объяснение.
Используй принцип:
**одна тема → одно место в итоговом материале → максимально полное содержание без повторов.**

---

# СТРУКТУРИРОВАНИЕ
Используй Markdown.
Основные разделы должны соответствовать указанной структуре.
Внутри разделов используй `##` и `###` для группировки крупных подтем, когда это действительно необходимо.
Не создавай большое количество мелких подразделов.
Не превращай весь материал в длинный список.
Используй:
* абзацы для объяснений;
* списки для перечислений;
* нумерованные списки для последовательностей;
* таблицы для сравнений;
* code blocks для кода и команд.

---

# ТЕХНИЧЕСКИЕ ТЕРМИНЫ
Сохраняй общепринятое английское написание технических терминов.
Например:
Python, FastAPI, Docker, Docker Compose, Kubernetes, PostgreSQL, ClickHouse, Kafka, Airflow, Spark, PySpark, OpenAI, Claude, GPT, RAG, MCP, LLM, API, SDK, JSON, YAML, Markdown, GitHub, GitLab, Cursor, VS Code, Ollama, Qwen, Gemma, LangChain, Hugging Face, ZooKeeper.
Не переводи технические термины без необходимости.

---

# НЕ ДОБАВЛЯЙ ИНФОРМАЦИЮ
Используй исключительно информацию из предоставленных конспектов.
Запрещено:
* использовать внешние знания;
* дополнять определения;
* придумывать примеры;
* добавлять собственные рекомендации;
* исправлять содержание лекции на основании собственных знаний;
* добавлять технологии, которые не упоминались;
* добавлять ссылки на внешние источники.
Если какой-либо аспект темы отсутствует в исходных материалах, не заполняй его самостоятельно.

---

# ПРОТИВОРЕЧИЯ
Если в разных частях встречаются противоречащие друг другу утверждения, не придумывай объяснение самостоятельно.
Сохрани информацию так, как она представлена в исходных материалах, по возможности указывая контекст, в котором было сделано соответствующее утверждение.
Не выбирай один вариант только на основании собственных знаний.

---

# КОД И ТЕХНИЧЕСКИЕ ПРИМЕРЫ
Сохраняй важные фрагменты кода, команды, SQL, конфигурации и другие технические примеры, если они существенны для понимания материала.
Не добавляй собственный код.
Не исправляй технические примеры на основании внешних знаний.

---

# ОСНОВНАЯ ИДЕЯ И ВЫВОДЫ
Раздел «Основная идея» должен давать общее представление о лекции.
Раздел «Что стоит запомнить» должен содержать наиболее важные знания, которые студенту следует вынести из лекции.
Не дублируй полностью содержание остальных разделов.

---

# ЧЕК-ЛИСТ
Чек-лист должен быть практическим.
Если лекция описывает процесс, используй последовательность действий.
Если лекция содержит рекомендации, преобразуй их в проверяемые пункты.
Пример:
* [ ] Определить источник данных.
* [ ] Настроить необходимый компонент.
* [ ] Проверить результат.
* [ ] Обработать ошибки.
Но используй только действия, которые действительно следуют из исходного материала.

---

# КАЧЕСТВО ИТОГОВОГО РЕЗУЛЬТАТА
Хороший итоговый материал должен:
1. Представлять всю лекцию как единое целое.
2. Не содержать повторяющихся разделов и одинаковых объяснений.
3. Сохранять важные детали из отдельных частей.
4. Быть значительно удобнее для изучения, чем исходные конспекты.
5. Позволять изучить основные материалы лекции без чтения исходных файлов.
6. Не содержать информации, которой не было в исходных материалах.

---

# ФОРМАТ ОТВЕТА
Верни только готовый учебный материал.
Не добавляй:
* пояснения о процессе обработки;
* комментарии;
* список использованных файлов;
* информацию о том, какие части были объединены;
* собственные замечания.
