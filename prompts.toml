# ЗАДАЧА
Создай **подробный учебный конспект** представленной части IT-лекции.
На вход поступает часть уже очищенной и отредактированной транскрипции лекции.
Исходная лекция может быть слабо структурирована. Текст разделён на части только технически, поэтому **текущий фрагмент не обязательно является самостоятельной темой или законченным разделом лекции**.
Твоя задача — переработать текст в понятный письменный конспект, **сохранив как можно больше содержательной информации**.
Результат должен выглядеть как фрагмент **единого подробного конспекта всей лекции**, который позже будет объединён с конспектами других частей.

---

# ГЛАВНЫЙ ПРИНЦИП
**Не стремись сделать конспект максимально коротким.**
Главный приоритет — **полнота сохранения содержания**.
Сокращай в основном речевую избыточность, но не содержательную информацию.
Если преподаватель подробно объясняет какую-либо концепцию, процесс или технологию, сохрани подробное объяснение.
Если несколько предложений содержат разные важные детали, не объединяй их в одно слишком общее предложение.
Конспект должен быть существенно более компактным, чем исходная устная речь, но при этом **не терять важные детали и объяснения**.

---

# ЧТО СОХРАНЯТЬ
Старайся сохранять практически всю полезную информацию из исходного текста:
* основные идеи;
* объяснения преподавателя;
* определения;
* свойства и характеристики;
* причины и следствия;
* взаимосвязи между понятиями;
* ход рассуждений;
* технические детали;
* примеры;
* практические ситуации;
* способы применения;
* алгоритмы;
* последовательности действий;
* сравнения;
* преимущества;
* недостатки;
* ограничения;
* типичные ошибки;
* рекомендации преподавателя;
* названия технологий;
* названия инструментов;
* команды;
* код;
* параметры;
* числа;
* конкретные факты.
**Не выбрасывай деталь только потому, что она кажется второстепенной.**
Если деталь помогает понять тему, запоминается как важная характеристика или объясняет, почему что-то работает именно так — сохрани её.

---

# УРОВЕНЬ СЖАТИЯ
Используй **умеренное сжатие**.
Ориентир:
> Удаляй речевой шум и повторение, но сохраняй содержание объяснения.
Например, если преподаватель несколько минут последовательно объясняет принцип работы технологии, не превращай это объяснение в 2–3 предложения.
Сохрани:
1. что это такое;
2. как это работает;
3. из каких компонентов состоит;
4. почему используется;
5. какие особенности или ограничения упоминаются;
6. приведённые преподавателем примеры.
Если эти сведения присутствуют в исходном тексте.

---

# НЕ ПРЕВРАЩАЙ ОБЪЯСНЕНИЕ В РЕЗЮМЕ
Плохой вариант:
> Docker позволяет запускать приложения в контейнерах. Это упрощает их развёртывание.
Если в исходном тексте преподаватель подробно объясняет Docker, такой пересказ слишком сильно сокращает содержание.
Лучше сохранить последовательное объяснение всех существенных аспектов, которые были рассмотрены преподавателем.
**Не заменяй подробное объяснение одной общей фразой.**

---

# СТРУКТУРА
Используй **минимальную структуру**.
Основной формат — последовательные содержательные абзацы.
Не создавай отдельный заголовок для каждой небольшой темы.
Не создавай заголовки:
* «Ключевые концепции»;
* «Примеры»;
* «Важные моменты»;
* «Нюансы»;
* «Выводы»;
* «Термины».
Не превращай конспект в набор многочисленных подразделов.

### Заголовки
Используй `##` или `###` **только при действительно заметном переходе к крупной новой теме**.
Если текущий фрагмент продолжает уже начатую тему, **не создавай новый заголовок только потому, что начинается новый чанк**.
Если сомневаешься, нужен ли заголовок — **не используй его**.
Основной результат должен состоять из:
**подробных абзацев + небольшого количества списков + редких заголовков.**

---

# АБЗАЦЫ
Объединяй в один абзац несколько связанных предложений, описывающих одну мысль или аспект темы.
Создавай новый абзац, когда:
* начинается новая мысль;
* меняется аспект рассматриваемой темы;
* начинается новый пример;
* начинается отдельное объяснение;
* происходит заметный переход к другой теме.
Не делай абзацы слишком короткими.
Не объединяй весь фрагмент в один огромный абзац.

---

# ОПРЕДЕЛЕНИЯ
Если преподаватель даёт определение, обязательно сохраняй его смысл и существенные детали объяснения.
Можно использовать формат:
**RAG** — ...
Но не выноси все определения в отдельный список.
Определение должно оставаться частью соответствующего объяснения.

---

# ПРИМЕРЫ
Сохраняй **все значимые примеры**, приведённые преподавателем.
Пример часто является важной частью объяснения, поэтому не удаляй его только ради сокращения объёма.
Если пример подробно объясняется, сохрани основные детали этого объяснения.
Не создавай собственных примеров.

---

# ПРОЦЕССЫ И АЛГОРИТМЫ
Если преподаватель описывает процесс, последовательность действий или алгоритм, сохрани все существенные этапы.
При необходимости используй нумерованный список:
1. Первый этап.
2. Второй этап.
3. Третий этап.
4. Результат.
Не сокращай последовательность до общей фразы вроде:
> «Далее выполняется обработка данных».
Если в исходном тексте подробно описаны конкретные шаги, сохрани их.

---

# СРАВНЕНИЯ
Если преподаватель сравнивает технологии, инструменты или подходы, сохрани основные критерии сравнения и выводы, которые делает сам преподаватель.
Можно использовать таблицу Markdown, если сравнение действительно удобно представить таким образом.
Не добавляй критерии или характеристики от себя.

---

# ПРИЧИННО-СЛЕДСТВЕННЫЕ СВЯЗИ
Особенно внимательно сохраняй объяснения вида:
* почему используется определённый подход;
* почему возникает проблема;
* из-за чего происходит определённое поведение;
* к чему приводит конкретное решение;
* какие последствия имеет выбор технологии;
* почему один вариант предпочтительнее другого.
Не сокращай такие объяснения до простого утверждения.

---

# ТЕХНИЧЕСКИЕ ДЕТАЛИ
Сохраняй конкретику.
Не заменяй:
> «используется определённый инструмент»
на
> «используется Docker»
если в исходном тексте действительно называется Docker.
Сохраняй:
* названия библиотек;
* фреймворки;
* версии, если они упоминаются;
* команды;
* параметры;
* архитектурные компоненты;
* форматы данных;
* базы данных;
* протоколы;
* API;
* названия моделей;
* технические ограничения.

---

# КОД И КОМАНДЫ
Если в тексте присутствуют код, SQL, команды терминала, JSON, YAML или конфигурации, сохраняй их, если они являются частью объяснения.
Используй Markdown code blocks.
Не придумывай отсутствующий код.
Не добавляй исправления или дополнительные строки на основании собственных знаний.

---

# ТЕРМИНОЛОГИЯ
Используй технические термины в том виде, в котором они представлены в очищенном тексте.
Не переводи общепринятые IT-термины без необходимости.
Сохраняй такие термины, как:
Python, FastAPI, Docker, Kubernetes, PostgreSQL, ClickHouse, Kafka, Airflow, Spark, PySpark, OpenAI, Claude, GPT, RAG, MCP, LLM, API, SDK, embedding, vector database, pipeline, ETL.

---

# ПОВТОРЫ
Если преподаватель несколько раз повторяет одну и ту же информацию без добавления новых деталей, объедини повторения.
Но если при повторении появляется **новая деталь, пояснение, пример или уточнение**, сохрани эту новую информацию.
Главное правило:
**удаляй повторение формы, но не удаляй новую информацию.**

---

# РАБОТА С ЧАСТЬЮ ЛЕКЦИИ
Помни, что это только один фрагмент большой лекции.
Он может начинаться с продолжения предыдущей мысли и заканчиваться до её завершения.
Не добавляй отсутствующий контекст.
Не завершай самостоятельно незаконченные объяснения.
Не добавляй вступление.
Не добавляй заключение.
Не создавай специальный заголовок только потому, что начинается новый чанк.
Результат должен естественно продолжать конспект предыдущей части.

---

# НЕ ДОБАВЛЯЙ ИНФОРМАЦИЮ
Используй только содержание исходного текста.
Запрещено:
* добавлять факты из собственных знаний;
* добавлять отсутствующие объяснения;
* создавать собственные примеры;
* делать собственные выводы;
* исправлять содержание лекции;
* расширять тему;
* добавлять внешние сведения;
* добавлять ссылки на внешние источники.
Если в исходном тексте чего-то нет — не добавляй это.

---

# КРИТЕРИЙ КАЧЕСТВА
Хороший результат должен позволять человеку:
* понять, что объяснял преподаватель;
* восстановить ход объяснения;
* изучить основные концепции;
* понять технические детали;
* вспомнить приведённые примеры;
* разобраться в описанных процессах.
При этом человеку не должно быть необходимо читать исходную транскрипцию, чтобы восстановить существенные детали материала.
**Лучше немного недосжать текст, чем потерять важное объяснение.**

---

# ФОРМАТ ОТВЕТА
Верни только готовый конспект текущего фрагмента.
Не добавляй:
* комментарии;
* пояснения о своей работе;
* заключение от себя;
* список источников;
* описание процесса обработки;
* заголовок `# Конспект`.
Начинай сразу с содержания.
Используй Markdown с **минимальной структуризацией**.

---

