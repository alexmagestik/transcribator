[notes]
text = """
# ЗАДАЧА

Создай подробный конспект из представленной части транскрипции лекции.

Лекция посвящена IT-тематике, преимущественно **AI, Machine Learning, Data Engineering и программированию**.

Лекция на русском языке, при этом в тексте встречаются английские технические термины, названия технологий, инструментов, библиотек, фреймворков и команд.

Твоя задача — преобразовать устную транскрипцию в **понятный, связный и подробный письменный конспект**, сохранив содержание и смысл лекции.

---

# ПРАВИЛА

Убирай из текста:

* слова-паразиты;
* повторы;
* речевые паузы;
* бессмысленные вводные фразы;
* приветствия и прощания;
* фрагменты речи, не несущие полезной информации.

Исправляй очевидные ошибки транскрипции, грамматику и пунктуацию.

При этом **не сокращай существенно содержание**.

Сохраняй:

* важные объяснения преподавателя;
* технические термины;
* английские названия технологий и инструментов;
* определения;
* причинно-следственные связи;
* примеры;
* практические рекомендации;
* последовательности действий;
* команды и фрагменты кода;
* числа и технические параметры;
* важные уточнения и оговорки.

---

# IT-ТЕРМИНОЛОГИЯ

Сохраняй общепринятые английские технические термины в оригинальном виде:

* API
* backend
* frontend
* pipeline
* embedding
* vector database
* Docker
* Kubernetes
* Python
* LLM
* RAG
* ETL
* Kafka
* Spark

Не переводи технические термины на русский, если это может ухудшить точность.

Если термин в транскрипции явно распознан неправильно, исправь его, если правильный вариант однозначно понятен из контекста.

---

# СТРУКТУРА

Не пытайся искусственно разделять материал на категории вроде:

* «Ключевые концепции»;
* «Примеры»;
* «Важные моменты»;
* «Нюансы»;
* «Практические рекомендации».

Отдельная обработка этих элементов будет выполнена позже.

Вместо этого создай **единый связный конспект**, разбивая его только на логические смысловые абзацы и темы там, где это естественно следует из содержания лекции.

Используй Markdown.

Допустимы заголовки `##` и `###`, если в тексте действительно происходит переход к новой теме.

---

# ПОДРОБНОСТЬ

Конспект должен быть достаточно подробным, чтобы по нему можно было понять содержание лекции без прослушивания исходной записи.

Не превращай текст в краткое резюме.

Не переписывай транскрипцию дословно.

Твоя задача:

**сохранить максимум полезной информации → убрать речевой шум → сделать текст понятным и структурированным.**

---

# РАБОТА С ЧАСТЬЮ ЛЕКЦИИ

На вход поступает **только часть большой лекции**.

Поэтому:

* не придумывай отсутствующий контекст;
* не добавляй информацию из своих знаний;
* не пытайся угадать, что было сказано в предыдущей или следующей части;
* не делай искусственного вступления или заключения;
* если фрагмент начинается или заканчивается посреди мысли, сохрани смысл настолько, насколько это возможно из имеющегося текста.

---

# КОД И КОМАНДЫ

Если в транскрипции присутствуют код, команды терминала, SQL, конфигурации или другие технические фрагменты, сохраняй их.

Используй Markdown code blocks.

Не изменяй код без необходимости.

---

# ГЛАВНОЕ ПРАВИЛО

**Не добавляй собственную информацию.**

Работай только с содержанием предоставленной транскрипции.

Если что-то в транскрипции непонятно или невозможно однозначно восстановить, не выдумывай правильный вариант.

---

# ФОРМАТ ОТВЕТА

Верни только готовый конспект в Markdown.

Не добавляй комментариев о своей работе.

Не пиши:

«Вот конспект...»

«В данном фрагменте лекции...»

«Я обработал транскрипцию...»

Начинай сразу с содержания.

---

# ТРАНСКРИПЦИЯ

[НАЧАЛО]

{{TEXT}}

[КОНЕЦ]
"""

