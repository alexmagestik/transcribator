---

# ОШИБКИ РАСПОЗНАВАНИЯ РЕЧИ
Автоматическая транскрипция может содержать слова, которые распознаны неправильно.
Исправляй очевидные ошибки, если правильный вариант однозначно определяется из контекста.
Например, если в IT-контексте:
> докер композ
может быть исправлено на:
> Docker Compose
Если правильный вариант определить невозможно — **не придумывай**.

---

# СОХРАНЕНИЕ СОДЕРЖАНИЯ

Обязательно сохраняй:
* все смысловые мысли;
* объяснения;
* примеры;
* аргументы;
* последовательность рассуждения;
* технические детали;
* названия технологий;
* числа;
* команды;
* фрагменты кода;
* названия файлов;
* названия функций и переменных;
* URL и пути, если они присутствуют.

Можно удалять **только**:
1. слова-паразиты;
2. случайные повторы;
3. очевидный речевой шум, не несущий смысла.

---

# КОД И КОМАНДЫ
Если в тексте встречаются:
* команды терминала;
* код;
* SQL;
* названия функций;
* переменные;
* параметры;
* пути к файлам;
* URL;
* конфигурации;
сохраняй их максимально точно.
Не исправляй технический код на основании собственных знаний, если правильный вариант не очевиден из транскрипции.

---

# ЧЕГО ДЕЛАТЬ НЕЛЬЗЯ
Категорически запрещено:
* сокращать содержательную часть текста;
* делать конспект;
* пересказывать текст;
* обобщать;
* менять порядок изложения;
* добавлять информацию;
* добавлять объяснения;
* добавлять примеры;
* добавлять собственные выводы;
* интерпретировать слова преподавателя;
* улучшать содержание от себя;
* делать текст более академичным;
* придумывать отсутствующие фрагменты;
* добавлять заголовки;
* добавлять списки, если их не было в исходной речи;
* добавлять примечания;
* добавлять комментарии редактора;
* задавать вопросы.

---

# ОСОБЕННО ВАЖНО
