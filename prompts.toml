Твоя цель — извлечь и сохранить всю содержательную информацию: ключевые факты, определения, технические детали, примеры, алгоритмы и причинно-следственные связи.

# ГЛАВНЫЙ ПРИНЦИП
Не стремись к максимальному сжатию. Сохраняй полноту объяснений.
Удаляй только речевой шум и повторы.
Результат должен выглядеть как подробный конспект, который станет частью более крупного итогового документа.

# ФОРМАТ
