<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transcribator</title>
<style>
  :root {
    --bg: #1c1c1e;
    --bg-2: #2a2a2c;
    --bg-3: #34343a;
    --fg: #e6e6e6;
    --fg-dim: #9a9aa0;
    --accent: #4a9eff;
    --green: #4ec07a;
    --orange: #d99340;
    --red: #d96a5c;
    --border: #3a3a3c;
    --code-bg: #1a1a1c;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #fafafa; --bg-2: #fff; --bg-3: #f0f0f2;
      --fg: #1c1c1e; --fg-dim: #6a6a70;
      --border: #d8d8dc; --code-bg: #f4f4f6;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    background: var(--bg); color: var(--fg);
    display: flex; flex-direction: column; height: 100vh;
  }

  /* Header */
  header {
    padding: 10px 16px; border-bottom: 1px solid var(--border);
    background: var(--bg-2); display: flex; align-items: center; gap: 16px;
    flex-wrap: wrap;
  }
  header h1 { margin: 0; font-size: 16px; font-weight: 600; }
  .status-pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 10px; border-radius: 10px; font-size: 12px;
    background: var(--bg-3); color: var(--fg-dim);
  }
  .status-pill .dot {
    width: 8px; height: 8px; border-radius: 50%; background: var(--fg-dim);
  }
  .status-pill.running { color: var(--green); }
  .status-pill.running .dot { background: var(--green); animation: pulse 1.2s infinite; }
  .status-pill.error { color: var(--red); }
  .status-pill.error .dot { background: var(--red); }
  @keyframes pulse { 50% { opacity: 0.3; } }
  .header-paths { display: flex; gap: 12px; flex-wrap: wrap; font-size: 11px; color: var(--fg-dim); }
  .header-paths code { background: var(--bg-3); padding: 2px 6px; border-radius: 4px; }
  .header-models { display: flex; gap: 12px; flex-wrap: wrap; font-size: 11px; color: var(--fg-dim); margin-top: 4px; }
  .header-models code { background: var(--bg-3); padding: 2px 6px; border-radius: 4px; }
  .header-spacer { flex: 1; }
  button {
    font: inherit; cursor: pointer; padding: 5px 12px;
    border: 1px solid var(--border); background: var(--bg-3);
    color: var(--fg); border-radius: 5px;
  }
  button:hover { background: var(--accent); border-color: var(--accent); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button.danger { color: var(--red); }

  /* Layout */
  main { display: flex; flex: 1; overflow: hidden; }
  .pane { display: flex; flex-direction: column; overflow: hidden; }
  .pane.left { width: 42%; border-right: 1px solid var(--border); }
  .pane.right { flex: 1; }

  /* Tree */
  .tree-toolbar {
    padding: 8px 12px; border-bottom: 1px solid var(--border);
    background: var(--bg-2); display: flex; gap: 8px; align-items: center;
  }
  .tree-toolbar input {
    flex: 1; padding: 4px 8px; font: inherit;
    background: var(--bg-3); color: var(--fg); border: 1px solid var(--border);
    border-radius: 4px;
  }
  .tree { flex: 1; overflow: auto; padding: 8px 0; user-select: none; }
  .tree ul { list-style: none; margin: 0; padding-left: 18px; }
  .tree li { list-style: none; padding: 2px 0; }
  .node {
    display: flex; align-items: center; gap: 6px;
    padding: 3px 8px; border-radius: 4px; cursor: pointer;
  }
  .node:hover { background: var(--bg-3); }
  .node.selected { background: var(--bg-3); }
  .node .name { flex: 1; }
  .node .size { font-size: 11px; color: var(--fg-dim); }
  .badge {
    display: inline-block; font-size: 10px; padding: 1px 5px;
    border-radius: 3px; background: var(--bg-3); color: var(--fg-dim);
    border: 1px solid var(--border);
  }
  .badge.on { background: rgba(78, 192, 122, 0.18); color: var(--green); border-color: rgba(78, 192, 122, 0.4); }
  .node .actions { display: none; gap: 4px; }
  .node:hover .actions, .node.selected .actions { display: inline-flex; }
  .node .actions button {
    padding: 1px 6px; font-size: 11px;
  }
  .folder-chevron {
    display: inline-block; width: 12px; color: var(--fg-dim);
    transition: transform 0.1s;
  }
  .folder-chevron.open { transform: rotate(90deg); }
  .folder-chevron { opacity: 0.4; }
.folder-chevron:not(.empty) { opacity: 1; }

  /* Viewer */
  .viewer-tabs {
    display: flex; gap: 0; border-bottom: 1px solid var(--border);
    background: var(--bg-2); align-items: center;
  }
  .tab {
    padding: 8px 16px; cursor: pointer; color: var(--fg-dim);
    border-bottom: 2px solid transparent;
  }
  .tab.active { color: var(--fg); border-bottom-color: var(--accent); }
  .tab.disabled { opacity: 0.4; cursor: not-allowed; }
  .tab-actions { margin-left: auto; padding-right: 12px; display: flex; gap: 6px; }
  .viewer {
    flex: 1; overflow: auto; padding: 16px 20px;
  }
  .viewer pre {
    background: var(--code-bg); padding: 12px; border-radius: 6px;
    overflow: auto; white-space: pre-wrap; word-wrap: break-word;
    font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .viewer .md-body { line-height: 1.6; max-width: 780px; }
  .viewer .md-body h1, .viewer .md-body h2, .viewer .md-body h3 { margin-top: 1.4em; }
  .viewer .md-body code { background: var(--code-bg); padding: 1px 4px; border-radius: 3px; font-size: 0.9em; }
  .viewer .md-body pre { padding: 12px; }
  .viewer .md-body pre code { background: none; padding: 0; }
  .viewer .md-body table { border-collapse: collapse; margin: 8px 0; }
  .viewer .md-body th, .viewer .md-body td { border: 1px solid var(--border); padding: 4px 8px; }

  /* Logs */
  .logs-pane {
    display: none; flex-direction: column; border-top: 1px solid var(--border);
    height: 40%; background: var(--code-bg);
  }
  .logs-pane.open { display: flex; }
  .logs-header {
    display: flex; align-items: center; gap: 8px; padding: 6px 12px;
    background: var(--bg-2); border-bottom: 1px solid var(--border);
    font-size: 12px;
  }
  .logs-header .title { font-weight: 600; }
  .logs-stream {
    flex: 1; overflow: auto; padding: 8px 12px;
    font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
    white-space: pre-wrap; word-wrap: break-word;
  }

  /* Toast */
  .toast {
    position: fixed; bottom: 20px; right: 20px; z-index: 1000;
    padding: 10px 16px; border-radius: 6px;
    background: var(--bg-2); border: 1px solid var(--border);
    box-shadow: 0 4px 16px rgba(0,0,0,0.3);
    max-width: 480px; opacity: 0; transition: opacity 0.2s;
    pointer-events: none;
  }
  .toast.show { opacity: 1; }
  .toast.error { border-color: var(--red); }
  .toast.success { border-color: var(--green); }

  .viewer .empty { color: var(--fg-dim); padding: 20px; text-align: center; }
</style>
</head>
<body>

<header>
  <h1>Transcribator</h1>
  <span id="status-pill" class="status-pill"><span class="dot"></span><span class="text">простаивает</span></span>
  <div class="header-paths" id="header-paths"></div>
  <div class="header-models" id="header-models"></div>
  <div class="header-spacer"></div>
  <button id="btn-toggle-logs">Логи</button>
  <button id="btn-refresh" title="Перечитать дерево">↻</button>
</header>

<main>
  <div class="pane left">
    <div class="tree-toolbar">
      <input id="filter" type="text" placeholder="Фильтр (подстрока имени)…">
      <button id="btn-run-all" class="primary" title="Прогнать полный pipeline на все source-mp3">▶ All</button>
    </div>
    <div class="tree" id="tree"></div>
  </div>

  <div class="pane right">
    <div class="viewer-tabs" id="tabs">
      <div class="tab disabled" data-kind="raw">raw</div>
      <div class="tab disabled" data-kind="clean">clean</div>
      <div class="tab disabled" data-kind="notes">notes</div>
      <div class="tab disabled" data-kind="summary">summary</div>
      <div class="tab-actions">
        <button id="btn-rerun-step" disabled>Re-run this step</button>
      </div>
    </div>
    <div class="viewer" id="viewer">
      <div class="empty">Выберите MP3-файл слева.</div>
    </div>
  </div>
</main>

<div class="logs-pane" id="logs-pane">
  <div class="logs-header">
    <span class="title">Логи процесса</span>
    <span id="logs-target" style="color: var(--fg-dim)"></span>
    <div style="flex:1"></div>
    <button id="btn-logs-clear" style="font-size:11px; padding: 2px 8px">Очистить</button>
    <button id="btn-logs-close" style="font-size:11px; padding: 2px 8px">×</button>
  </div>
  <div class="logs-stream" id="logs-stream"></div>
</div>

<div id="toast" class="toast"></div>

<script>
'use strict';

// ---------- Состояние ----------
const state = {
  tree: null,
  config: null,
  selected: null,            // { rel, name, has_raw, has_clean, has_summary }
  activeTab: null,           // 'raw' | 'clean' | 'summary'
  filter: '',
  running: false,
  lastSeq: 0,
  sse: null,
};

// ---------- Утилиты ----------
const $ = (sel) => document.querySelector(sel);
const $$ = (sel) => Array.from(document.querySelectorAll(sel));
function toast(msg, kind = '') {
  const el = $('#toast');
  el.textContent = msg;
  el.className = 'toast show ' + kind;
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove('show'), 4000);
}
async function api(path, opts = {}) {
  const res = await fetch(path, {
    headers: { 'Content-Type': 'application/json' },
    ...opts,
  });
  const text = await res.text();
  let body;
  try { body = text ? JSON.parse(text) : null; } catch { body = { raw: text }; }
  if (!res.ok) {
    const err = new Error(body?.error || `HTTP ${res.status}`);
    err.status = res.status;
    err.body = body;
    throw err;
  }
  return body;
}

// ---------- Header ----------
async function loadConfig() {
  state.config = await api('/api/config');
  const paths = $('#header-paths');
  paths.innerHTML = '';
  for (const [label, key] of [
    ['source', 'source_dir'], ['raw', 'raw_dir'], ['clean', 'clean_dir'], ['summary', 'summary_dir'],
  ]) {
    const span = document.createElement('span');
    span.innerHTML = `${label} <code>${state.config[key]}</code>`;
    paths.appendChild(span);
  }
  const models = $('#header-models');
  models.innerHTML = '';
  for (const [label, key] of [
    ['whisper', 'whisper_model'],
    ['ollama clean', 'ollama_clean_model'],
    ['ollama summary', 'ollama_summary_model'],
    ['ollama host', 'ollama_host'],
  ]) {
    const span = document.createElement('span');
    span.innerHTML = `${label} <code>${state.config[key]}</code>`;
    models.appendChild(span);
  }
}

// ---------- Статус ----------
let statusTimer = null;

function setRunButtonsDisabled(disabled) {
  // Блокируем все кнопки запуска при активном процессе:
  // #btn-run-all + все <button> внутри .actions в дереве.
  $('#btn-run-all').disabled = disabled;
  for (const b of document.querySelectorAll('#tree .actions button')) {
    b.disabled = disabled;
  }
  // и кнопка "Re-run this step" в viewer
  const r = $('#btn-rerun-step');
  if (r) r.disabled = disabled || !state.activeTab;
}

async function pollStatus() {
  try {
    const s = await api('/api/status');
    const wasRunning = state.running;
    state.running = s.running;
    const pill = $('#status-pill');
    const text = pill.querySelector('.text');
    if (s.running) {
      pill.className = 'status-pill running';
      const what = s.tracked?.step || s.command || '';
      const file = s.tracked?.current_file ? ` · ${s.tracked.current_file.split('/').pop()}` : '';
      text.textContent = `идёт (PID ${s.pid || s.tracked?.pid || '?'}) ${what}${file}`;
      if (!wasRunning) {
        // только что стартовало — открыть лог
        openLogsPane();
        $('#logs-target').textContent = `${s.command} ${s.target || ''}`;
        startSSE();
      }
      setRunButtonsDisabled(true);
    } else {
      pill.className = 'status-pill';
      const lastExit = s.exit_code;
      if (lastExit === 0) {
        text.textContent = 'готово';
        pill.classList.add('running');
      } else if (lastExit != null) {
        pill.className = 'status-pill error';
        text.textContent = `ошибка (exit ${lastExit})`;
      } else {
        text.textContent = 'простаивает';
      }
      setRunButtonsDisabled(false);
      if (wasRunning) {
        stopSSE();
        await loadTree();
        if (state.selected) await refreshTabsForSelected();
      }
    }
  } catch (e) {
    console.warn('pollStatus:', e);
  }
}

// ---------- Дерево ----------
async function loadTree() {
  state.tree = await api('/api/tree');
  renderTree();
}

function renderTree() {
  const root = $('#tree');
  root.innerHTML = '';
  if (!state.tree) { root.innerHTML = '<div class="empty">Нет данных</div>'; return; }
  if (state.tree.missing) {
    root.innerHTML = `<div class="empty">source-mp3 не найден: ${state.tree.name}</div>`;
    return;
  }
  const ul = document.createElement('ul');
  ul.style.paddingLeft = '8px';
  ul.appendChild(renderNode(state.tree, true));
  root.appendChild(ul);
  // кнопки перерендерились — синхронизировать disabled с текущим running
  setRunButtonsDisabled(state.running);
}

function matchesFilter(name) {
  if (!state.filter) return true;
  return name.toLowerCase().includes(state.filter.toLowerCase());
}

function renderNode(node, isRoot) {
  const li = document.createElement('li');
  const row = document.createElement('div');
  row.className = 'node';

  if (node.type === 'dir') {
    const chev = document.createElement('span');
    chev.className = 'folder-chevron open';
    chev.textContent = '▶';
    const hasChildren = node.children && node.children.length > 0;
    if (!hasChildren) chev.classList.add('empty');
    row.appendChild(chev);

    const name = document.createElement('span');
    name.className = 'name';
    name.textContent = node.name + '/';
    row.appendChild(name);

    const mp3Count = (node.children || []).filter(c => c.type === 'file').length;
    const subDirCount = (node.children || []).filter(c => c.type === 'dir').length;
    if (mp3Count > 0) {
      const count = document.createElement('span');
      count.className = 'size';
      count.textContent = `${mp3Count} mp3`;
      row.appendChild(count);
    } else if (subDirCount === 0) {
      const empty = document.createElement('span');
      empty.className = 'size';
      empty.textContent = '(пусто)';
      row.appendChild(empty);
    }

    if (node.has_summary !== undefined && !isRoot) {
      const b = document.createElement('span');
      const on = node.has_summary;
      b.className = 'badge' + (on ? ' on' : '');
      b.textContent = 'S';
      b.title = on ? 'Общий саммари есть' : 'Общего саммари нет';
      row.appendChild(b);
    }

    const actions = document.createElement('span');
    actions.className = 'actions';
    if (mp3Count > 0) {
      const b = document.createElement('button');
      b.textContent = '▶ pipeline';
      b.title = 'Запустить полный pipeline на все mp3 в этой папке';
      b.onclick = (e) => { e.stopPropagation(); runOnNode(node, 'pipeline'); };
      actions.appendChild(b);

      const bSum = document.createElement('button');
      bSum.textContent = 'Summary';
      bSum.title = 'Создать один саммари для всей папки';
      bSum.onclick = (e) => { e.stopPropagation(); runOnNode(node, 'summary'); };
      actions.appendChild(bSum);
    }
    row.appendChild(actions);

    let ul = null;
    if (node.children && node.children.length > 0) {
      ul = document.createElement('ul');
      ul.style.display = isRoot ? 'block' : 'block';
      for (const child of node.children) {
        if (child.type === 'file' && !matchesFilter(child.name)) continue;
        if (child.type === 'dir' && !matchesFilter(child.name)) continue;
        ul.appendChild(renderNode(child, false));
      }
    }
    li.appendChild(row);
    if (ul) li.appendChild(ul);

    row.onclick = () => {
      if (!ul) return;  // пустая папка — нечего сворачивать
      const open = ul.style.display !== 'none';
      ul.style.display = open ? 'none' : 'block';
      chev.classList.toggle('open', !open);
      if (node.has_summary) {
        openFile(node, 'summary');
      }
    };
  } else {
    // file
    const sp = document.createElement('span');
    sp.style.width = '12px'; sp.style.display = 'inline-block';
    row.appendChild(sp);

    const name = document.createElement('span');
    name.className = 'name';
    name.textContent = node.name;
    row.appendChild(name);

    const size = document.createElement('span');
    size.className = 'size';
    size.textContent = `${node.size_mb} MB`;
    row.appendChild(size);

    for (const kind of ['raw', 'clean', 'notes']) {
      const b = document.createElement('span');
      const on = node[`has_${kind}`];
      b.className = 'badge' + (on ? ' on' : '');
      b.textContent = kind[0].toUpperCase();
      b.title = on ? `${kind} есть` : `${kind} нет`;
      row.appendChild(b);
    }

    const actions = document.createElement('span');
    actions.className = 'actions';
    for (const cmd of ['pipeline', 'whisper', 'clean', 'notes']) {
      const b = document.createElement('button');
      b.textContent = cmd === 'pipeline' ? '▶' : cmd;
      b.title = cmd === 'pipeline' ? 'Запустить pipeline' : `Только ${cmd}`;
      b.onclick = (e) => { e.stopPropagation(); runOnNode(node, cmd); };
      actions.appendChild(b);
    }
    row.appendChild(actions);

    li.appendChild(row);  // <-- БАГ БЫЛ ТУТ: пропущено, файлы не рендерились

    row.onclick = () => {
      $$('.node.selected').forEach(n => n.classList.remove('selected'));
      row.classList.add('selected');
      state.selected = node;
      openFile(node, 'raw');
    };
  }
  return li;
}

// ---------- Viewer ----------
function setActiveTab(kind) {
  state.activeTab = kind;
  $$('#tabs .tab').forEach(t => {
    t.classList.toggle('active', t.dataset.kind === kind);
  });
  $('#btn-rerun-step').disabled = !kind || state.running;
}

async function openFile(node, preferredKind = null) {
  state.selected = node;
  // определить, какие вкладки доступны
  const tabs = $$('#tabs .tab');
  for (const t of tabs) {
    const kind = t.dataset.kind;
    const on = node[`has_${kind}`];
    t.classList.toggle('disabled', !on);
  }
  // выбрать вкладку: сначала приоритетную, затем по порядку
  let chosen = preferredKind;
  if (chosen && !node[`has_${chosen}`]) {
    chosen = null;
  }
  if (!chosen) {
    const order = ['summary', 'notes', 'clean', 'raw'];
    for (const k of order) {
      if (node[`has_${k}`]) { chosen = k; break; }
    }
  }
  if (!chosen) {
    $('#viewer').innerHTML = '<div class="empty">Нет артефактов. Запустите pipeline на этом файле.</div>';
    setActiveTab(null);
    return;
  }
  setActiveTab(chosen);
  await loadView();
}

async function refreshTabsForSelected() {
  if (!state.selected) return;
  // Дерево уже обновлено в pollStatus перед вызовом этой функции
  const found = findNode(state.tree, state.selected.rel);
  if (found) {
    state.selected = found;
    await openFile(found);
  }
}

function findNode(node, rel) {
  if (node.rel === rel) return node;
  if (!node.children) return null;
  for (const c of node.children) {
    const f = findNode(c, rel);
    if (f) return f;
  }
  return null;
}

async function loadView() {
  const kind = state.activeTab;
  const node = state.selected;
  if (!kind || !node) return;
  try {
    const data = await api(`/api/view?mp3=${encodeURIComponent(node.rel)}&kind=${kind}`);
    const viewer = $('#viewer');
    if (kind === 'summary' && data.html) {
      viewer.innerHTML = `<div class="md-body">${data.html}</div>`;
    } else {
      viewer.innerHTML = `<pre>${escapeHtml(data.text || '')}</pre>`;
    }
  } catch (e) {
    $('#viewer').innerHTML = `<div class="empty" style="color: var(--red)">Ошибка: ${escapeHtml(e.message)}</div>`;
  }
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  }[c]));
}

// ---------- Запуск ----------
async function runOnNode(node, command) {
  // node.rel задан относительно source-mp3 (корень дерева). Добавляем префикс,
  // чтобы transcribe.py (запущенный с cwd=BASE_DIR) нашёл путь.
  const isFile = node.type === 'file';
  const pathWithPrefix = 'source-mp3/' + node.rel;
  const target = isFile ? pathWithPrefix : (pathWithPrefix.endsWith('/') ? pathWithPrefix : pathWithPrefix + '/');
  const body = {
    command,
    path: target,
  };
  // для summary шага удобно фильтровать по имени файла
  if (isFile && command !== 'pipeline') {
    body.match = node.name.replace(/\.mp3$/i, '');
  }
  // Отдельные шаги (whisper/clean/summary) — перезаписывать,
  // чтобы кнопка "только clean" перегенерировала clean.txt.
  // pipeline (All / для папки / для файла) — пропускать существующие,
  // чтобы не перезаписывать уже обработанные артефакты без явного force.
  if (command !== 'pipeline') {
    body.force = true;
  }
  try {
    const r = await api('/api/run', { method: 'POST', body: JSON.stringify(body) });
    toast(`Запущено: ${command} → ${r.target || body.path}`, 'success');
    await pollStatus();
  } catch (e) {
    if (e.status === 409) {
      toast(`Конфликт: уже идёт транскрибация (PID ${e.body?.pid || '?'})`, 'error');
    } else {
      toast(`Ошибка: ${e.message}`, 'error');
    }
  }
}

async function runRerunStep() {
  if (!state.selected || !state.activeTab) return;
  const step = state.activeTab; // 'raw' | 'clean' | 'notes' | 'summary'
  await runOnNode(state.selected, step === 'raw' ? 'whisper' : step);
}

async function runOnAll() {
  await runOnNode({ type: 'dir', rel: '' }, 'pipeline');
}

// ---------- Логи (SSE) ----------
function openLogsPane() {
  $('#logs-pane').classList.add('open');
}
function closeLogsPane() {
  $('#logs-pane').classList.remove('open');
}
function startSSE() {
  stopSSE();
  state.lastSeq = 0;
  const es = new EventSource('/api/logs/stream');
  state.sse = es;
  const stream = $('#logs-stream');
  es.addEventListener('log', (e) => {
    try {
      const { seq, line } = JSON.parse(e.data);
      if (seq <= state.lastSeq) return;
      state.lastSeq = seq;
      const div = document.createElement('div');
      div.textContent = line;
      stream.appendChild(div);
      stream.scrollTop = stream.scrollHeight;
    } catch {}
  });
  es.addEventListener('done', () => {
    stopSSE();
    pollStatus();
  });
  es.onerror = () => {
    // браузер сам переподключится; ничего не делаем
  };
}
function stopSSE() {
  if (state.sse) {
    state.sse.close();
    state.sse = null;
  }
}

// ---------- События ----------
$('#btn-refresh').onclick = () => loadTree();
$('#btn-run-all').onclick = runOnAll;
$('#btn-toggle-logs').onclick = () => $('#logs-pane').classList.toggle('open');
$('#btn-logs-close').onclick = closeLogsPane;
$('#btn-logs-clear').onclick = () => { $('#logs-stream').innerHTML = ''; };
$('#filter').oninput = (e) => { state.filter = e.target.value; renderTree(); };
$$('#tabs .tab').forEach(t => {
  t.onclick = () => {
    if (t.classList.contains('disabled')) return;
    setActiveTab(t.dataset.kind);
    loadView();
  };
});
$('#btn-rerun-step').onclick = runRerunStep;

// ---------- Bootstrap ----------
(async () => {
  await loadConfig();
  await loadTree();
  await pollStatus();
  statusTimer = setInterval(pollStatus, 3000);
})();
</script>
